<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5c">
  <title>Routine Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="logo">Routine</h1>
    <nav class="tabs" aria-label="表示切替">
      <button data-view="day" class="active">日次</button>
      <button data-view="week">週次</button>
      <button data-view="month">月次</button>
      <button data-view="settings">設定</button>
    </nav>
  </header>
  <main id="app"></main>
  <script src="app.js"></script>
</body>
</html>
